name: train-on-kaggle

# Add the label "train" to a PR that changes one file in configs/experiments/.
# The job trains, evaluates, gates and explains on Kaggle's GPU, then comments here.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      config:
        description: "Experiment config, e.g. configs/experiments/seed7.yaml"
        required: true

# One GPU, one quota: queue runs instead of starting them in parallel.
concurrency:
  group: kaggle-gpu
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  kaggle:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'train'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USER: binushifani
      INPUT_CONFIG: ${{ inputs.config }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -q -U kaggle

      - name: Pick the experiment config
        id: cfg
        run: |
          if [ -n "$INPUT_CONFIG" ]; then
            CFG="$INPUT_CONFIG"
          else
            CFG=$(python scripts/kaggle_job.py pick-config --base "origin/$BASE_REF")
          fi
          test -f "$CFG" || { echo "config not found: $CFG"; exit 1; }
          echo "config=$CFG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$CFG" .yaml)" >> "$GITHUB_OUTPUT"
          echo "Experiment: $CFG at $(git rev-parse --short HEAD)"

      - name: Build and push the Kaggle job
        run: |
          python scripts/kaggle_job.py build --config "${{ steps.cfg.outputs.config }}" \
            --sha "$(git rev-parse HEAD)" --user "$KAGGLE_USER" --out kaggle-job
          kaggle kernels push -p kaggle-job

      - name: Wait for Kaggle (train, evaluate, gate, explain)
        run: python scripts/kaggle_job.py wait --kernel "$KAGGLE_USER/perceptiongate-run" --timeout-min 180

      - name: Download outputs and build the comment
        if: always()
        run: |
          mkdir -p kaggle-out
          kaggle kernels output "$KAGGLE_USER/perceptiongate-run" -p kaggle-out || true
          python scripts/kaggle_job.py summary --outputs kaggle-out \
            --name "${{ steps.cfg.outputs.name }}" --out comment.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-${{ steps.cfg.outputs.name }}
          path: kaggle-out
          retention-days: 14

      - name: Comment on the PR (updates the previous one)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { body } = JSON.parse(fs.readFileSync('comment.json', 'utf8'));
            const marker = '<!-- perceptiongate-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number });
            const old = comments.find(c => c.body && c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Gate decision
        run: |
          D=$(python -c "import json; print(json.load(open('comment.json'))['decision'])")
          echo "Gate decision: $D"
          if [ "$D" = "NEEDS_REVIEW" ]; then echo "::warning::Gate asks for human review"; fi
          if [ "$D" = "FAIL" ] || [ "$D" = "ERROR" ]; then exit 1; fi
