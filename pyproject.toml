[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "perceptiongate"
version = "0.1.0"
description = "CI/CD for a driving-perception detector: train, evaluate by slice, gate, and explain with agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Binu Shefield Shifani" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]
# Heavy groups are kept separate so CI lint/test jobs stay fast.
train = ["ultralytics>=8.3"]
tracking = ["mlflow>=2.14"]
agents = ["langgraph>=0.2", "langchain-core>=0.3"]

[project.scripts]
pgate = "perceptiongate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/perceptiongate"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["perceptiongate"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=perceptiongate --cov-report=term-missing"
