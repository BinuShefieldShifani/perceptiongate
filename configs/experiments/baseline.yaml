name: baseline
description: First reference model. Every later run is compared against this one.

data:
  root: data/bdd100k_subset
  train_images: 10000
  val_images: 2000
  classes: [car, truck, bus, pedestrian, rider, bicycle, motorcycle, traffic_light, traffic_sign]
  image_size: 640
  seed: 42

train:
  weights: yolo11n.pt
  epochs: 30
  batch: 32
  lr0: 0.01
  device: auto
  seed: 42
